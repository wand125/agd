<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="agd">
<title>agd</title>
<link rel="icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon.png">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/manifest.webmanifest">
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d; --fg: #c9d1d9; --dim: #8b949e;
    --busy: #e3b341; --waiting: #f85149; --idle: #3fb950; --resumable: #6e7681;
    --accent: #58a6ff;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  /* ---- テキスト選択の可否 ----
     スマホでは長押しやスワイプで意図せず選択・コピーメニューが出るため、
     既定は選択不可。読んでコピーしたい箇所だけ許可する。
     -webkit-touch-callout も切らないと iOS で長押しメニューが出る。 */
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #dscreen, .entry, .sum, #dmeta, .ai-title, input, textarea {
    user-select: text; -webkit-user-select: text; -webkit-touch-callout: default;
  }
  /* 押す対象は常に選択不可。フリック中に文字が反転するのを防ぐ */
  button, .chip, .abtn, .hbtn, #dtabs div, .proj, .host, .dot, .age, .name {
    user-select: none !important; -webkit-user-select: none !important;
    -webkit-touch-callout: none !important;
  }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--fg); font-size: 15px;
    font-family: -apple-system, "Hiragino Sans", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ---- ヘッダー: 1段に固定。PC版のような折り返しを起こさない ---- */
  header {
    flex: none; padding: calc(var(--safe-top) + 8px) 12px 8px;
    border-bottom: 1px solid var(--border); background: var(--bg);
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 17px; font-weight: 700; letter-spacing: .5px; }
  .counts { display: flex; gap: 8px; font-size: 13px; margin-left: auto; }
  .counts b { font-weight: 600; }
  .c-waiting { color: var(--waiting); } .c-busy { color: var(--busy); } .c-idle { color: var(--idle); }
  /* 接続状態。既定(接続済み)は何も出さず、異常時だけ点で知らせる */
  #conn { width: 7px; height: 7px; border-radius: 50%; flex: none; display: none; }
  #conn.offline { display: block; background: var(--waiting); animation: blink 1s infinite; }
  #conn.readonly { display: block; background: var(--dim); animation: none; }
  .hbtn { background: none; border: none; color: var(--dim); padding: 6px; cursor: pointer;
          display: inline-flex; align-items: center; justify-content: center; }
  /* 線画アイコン。currentColor で色が決まるので状態に応じて CSS だけで変えられる */
  .hbtn svg { width: 21px; height: 21px; fill: none; stroke: currentColor;
              stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* ---- フィルタ: 既定は隠す。必要なときだけ開く ---- */
  #filters { flex: none; display: none; gap: 6px; padding: 8px 12px;
             border-bottom: 1px solid var(--border); overflow-x: auto; }
  #filters.on { display: flex; animation: slideDown .16s ease-out; }
  .chip { font-size: 13px; padding: 5px 12px; border-radius: 14px; border: 1px solid var(--border);
          background: var(--panel); color: var(--dim); white-space: nowrap; }
  .chip.on { color: var(--fg); border-color: var(--accent); background: rgba(88,166,255,.14); }
  #q { flex: none; width: 100%; padding: 9px 12px; font-size: 15px; background: var(--panel);
       border: 1px solid var(--border); border-radius: 8px; color: var(--fg); outline: none; }
  #qwrap { display: none; padding: 8px 12px; border-bottom: 1px solid var(--border); }
  #qwrap.on { display: block; animation: slideDown .16s ease-out; }
  @keyframes slideDown { from { transform: translateY(-6px); opacity: 0; } }

  /* ---- 一覧: 1行1セッション ---- */
  #list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
          padding-bottom: calc(var(--safe-bottom) + 12px);
          transition: transform .22s cubic-bezier(.2,.8,.2,1), opacity .22s; }
  /* 詳細が乗っている間は一覧を少し奥へ引く(戻ったときの前後関係が分かる) */
  body.detail-open #list { transform: scale(.97); opacity: .6; }
  .row { display: flex; align-items: flex-start; gap: 10px; padding: 11px 12px;
         border-bottom: 1px solid var(--border); background: var(--bg);
         /* 縦スクロールはブラウザに任せ、横方向のジェスチャだけ JS が扱う。
            auto のままだと横フリック中も慣性の縦スクロールが続き、
            掴んでいない行まで動いて見える */
         touch-action: pan-y; }
  /* スワイプ中の行だけを合成レイヤーに上げる。全行に will-change を付けると
     各行が独立レイヤーになり、通常スクロール時に浮いて見える */
  .row.swiping { position: relative; z-index: 1; will-change: transform; }
  /* スワイプ中に行の下(左側)から現れるアクション表示。
     行自体が translateX で右へ動くことで見えるようになる。 */
  .row::before {
    content: attr(data-action); position: absolute; left: -64px; top: 0; bottom: 0; width: 64px;
    display: none; align-items: center; justify-content: center; gap: 4px;
    font-size: 11px; font-weight: 600; color: #0d1117; background: var(--busy);
    z-index: -1; white-space: pre-line; text-align: center; line-height: 1.25;
  }
  .row.swiping::before { display: flex; }
  /* 確定圏に入ったら色を濃くして知らせる。ピン留めは緑、解除は赤で
     「何が起きるか」を色でも区別する */
  .row.swiping.armed::before { background: var(--idle); }
  .row.pinned.swiping.armed::before { background: var(--waiting); color: #fff; }
  .row:active { background: var(--panel); }
  .row.waiting { background: rgba(248,81,73,.08); }
  /* ピン留めした行は左に印を付けて、常に上位に来ることを分かるようにする */
  .row.pinned { box-shadow: inset 3px 0 0 var(--busy); }
  .pin-mark { font-size: 10px; flex: none; opacity: .9; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; margin-top: 5px; }
  .dot.waiting { background: var(--waiting); animation: blink 1s infinite; }
  .dot.busy { background: var(--busy); animation: pulse 1.6s infinite; }
  .dot.idle { background: var(--idle); }
  .dot.resumable { background: var(--resumable); }
  @keyframes pulse { 50% { opacity: .4; } }
  @keyframes blink { 50% { opacity: .2; } }
  .body { flex: 1; min-width: 0; }
  .line1 { display: flex; align-items: center; gap: 6px; }
  .proj { font-size: 10.5px; padding: 1px 7px; border-radius: 9px; color: #0d1117; font-weight: 700; flex: none; }
  .name { font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .age { margin-left: auto; font-size: 12px; color: var(--dim); flex: none; }
  /* 要約は2行まで。監視盤の主役なので省略しすぎない */
  /* Claude アプリ側の表示名。識別名の下に控えめに置く */
  .ai-title { font-size: 11.5px; color: var(--accent); opacity: .85; margin-top: 2px;
              overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dtitle .ai-title { font-size: 11.5px; }
  .sum { font-size: 12.5px; color: #9aa4b2; line-height: 1.45; margin-top: 3px;
         display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .host { font-size: 10.5px; color: var(--accent); border: 1px solid var(--accent);
          border-radius: 8px; padding: 0 5px; flex: none; }
  .empty { padding: 40px 20px; text-align: center; color: var(--dim); }

  /* 入力待ちの応答ボタン(一覧から直接押せる) */
  .answers { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .abtn { font-size: 12.5px; padding: 6px 12px; border-radius: 8px; background: #21262d;
          border: 1px solid rgba(248,81,73,.5); color: var(--fg); }
  .abtn:active { background: var(--accent); color: #0d1117; }
  /* 複数選択の確定。チェック用のボタンと役割が違うので見た目で分ける */
  .abtn.confirm { border-color: var(--accent); background: rgba(31,111,235,.3); font-weight: 600; }

  /* ---- 詳細: 全画面。画面キャプチャと会話ログをタブで切替 ---- */
  /* 詳細は右からスライドイン。display の切替では transition が効かないので、
     常に flex のまま画面外へ逃がして transform を動かす */
  #detail { position: fixed; inset: 0; background: var(--bg); z-index: 20;
            display: flex; flex-direction: column; max-width: 100vw; overflow: hidden;
            transform: translateX(100vw); pointer-events: none;
            transition: transform .22s cubic-bezier(.2,.8,.2,1); }
  #detail.on { transform: translateX(0); pointer-events: auto; }
  #dhead { flex: none; display: flex; align-items: center; gap: 9px;
           padding: calc(var(--safe-top) + 8px) 12px 8px; border-bottom: 1px solid var(--border); }
  #dback { color: var(--accent); flex: none; padding: 6px 8px 6px 0; }
  #dback svg { width: 24px; height: 24px; }
  #dtitle { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dmeta { font-size: 11.5px; color: var(--dim); }
  #dtabs { flex: none; display: flex; border-bottom: 1px solid var(--border); }
  #dtabs div { flex: 1; text-align: center; padding: 9px; font-size: 13.5px; color: var(--dim); }
  #dtabs div.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
  #dbody { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
           min-height: 0; min-width: 0; width: 100%; }
  /* 端末画面は横スクロールで原寸を保つ(折り返すと桁が崩れて読めない) */
  #dscreen { font-family: "SF Mono", Menlo, monospace; font-size: 10.5px; line-height: 1.4;
             background: #010409; color: #b0bac4; padding: 10px; white-space: pre;
             overflow-x: auto; min-height: 100%; max-width: 100%; }
  #dlog { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px;
          max-width: 100%; min-width: 0; }
  .entry { border-radius: 8px; padding: 9px 11px; font-size: 13.5px; line-height: 1.55;
           white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere;
           max-width: 100%; min-width: 0; }
  .entry.user { background: rgba(31,111,235,.15); border: 1px solid rgba(31,111,235,.4); align-self: flex-end; max-width: 88%; }
  .entry.assistant { background: #1c2129; border: 1px solid var(--border); }
  /* 思考・ツールは畳んで見出しだけ出す(PC版と同じ形式) */
  .entry.thinking, .entry.tool_use, .entry.tool_result { padding: 0; background: none; border: none; }
  .entry details { border: 1px dashed var(--border); border-radius: 8px; padding: 6px 11px; color: var(--dim); }
  .entry details[open] { color: var(--fg); }
  /* 指で押しやすいよう PC版より広めに取る */
  .entry summary { cursor: pointer; font-size: 12px; color: var(--dim); padding: 3px 0;
                   list-style: none; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry summary::-webkit-details-marker { display: none; }
  .entry summary::before { content: "▸ "; color: var(--dim); }
  .entry details[open] summary::before { content: "▾ "; }
  .entry details pre { font-family: "SF Mono", Menlo, monospace; font-size: 11px;
                       overflow-x: auto; margin-top: 6px; white-space: pre-wrap; word-break: break-all; }
  .diff-line { display: block; }
  .diff-add { background: rgba(63,185,80,.15); color: #7ee787; }
  .diff-del { background: rgba(248,81,73,.15); color: #ffa198; }
  .diff-file { color: var(--accent); font-size: 11px; }
  .entry a { color: var(--accent); word-break: break-all; }
  /* ---- ログ本文の Markdown(端末画面には適用しない) ---- */
  .entry .md-h { font-weight: 700; margin: 6px 0 2px; }
  .entry .md-h1 { font-size: 1.15em; }
  .entry .md-h2 { font-size: 1.08em; }
  .entry .md-h3, .entry .md-h4 { font-size: 1em; color: var(--accent); }
  .entry ul, .entry ol { margin: 2px 0 2px 1.2em; padding: 0; }
  .entry li { margin: 1px 0; white-space: normal; }
  .entry .md-h, .entry .md-quote { white-space: normal; }
  .entry code { background: rgba(110,118,129,.25); border-radius: 4px; padding: 0 4px;
                font-family: "SF Mono", Menlo, monospace; font-size: .92em; }
  .entry pre.md-code { background: #010409; border: 1px solid var(--border); border-radius: 6px;
                       padding: 8px 10px; margin: 5px 0; overflow-x: auto;
                       font-family: "SF Mono", Menlo, monospace; font-size: .9em;
                       white-space: pre; }
  .entry pre.md-code code { background: none; padding: 0; }
  /* 表。狭い画面では収まらないので、表だけを横スクロールさせる */
  .entry .md-table-wrap { overflow-x: auto; margin: 5px 0; }
  .entry .md-table { border-collapse: collapse; font-size: .95em; }
  .entry .md-table th, .entry .md-table td {
    border: 1px solid var(--border); padding: 4px 9px; white-space: nowrap; }
  .entry .md-table th { background: rgba(110,118,129,.18); font-weight: 600; }
  .entry .md-table tbody tr:nth-child(even) td { background: rgba(110,118,129,.07); }
  .entry .md-quote { border-left: 3px solid var(--border); padding-left: 8px; color: var(--dim); margin: 2px 0; }
  .entry .md-hr { border: none; border-top: 1px solid var(--border); margin: 6px 0; }
  .entry strong { font-weight: 700; }
  .entry em { font-style: italic; }
  .entry del { opacity: .6; }
  .ts { font-size: 10px; color: var(--dim); }
  /* 送信欄は最小限。長文入力は想定せず「Yes」「続けて」程度を送る */
  #dsend { flex: none; display: flex; gap: 8px; padding: 8px 12px calc(var(--safe-bottom) + 8px);
           border-top: 1px solid var(--border); background: var(--bg); }
  #dinput { flex: 1; background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
            color: var(--fg); padding: 9px 12px; font-size: 16px; outline: none; }
  #dsendbtn { background: var(--accent); color: #0d1117; border: none; border-radius: 8px;
              padding: 9px 16px; font-weight: 600; font-size: 14px; }
  #dprompt { flex: none; padding: 8px 12px; background: rgba(248,81,73,.1);
             border-top: 1px solid var(--border); display: none;
             animation: promptIn .2s cubic-bezier(.2,.8,.2,1); }
  #dprompt.on { display: block; }
  @keyframes promptIn { from { transform: translateY(8px); opacity: 0; } }
  #dpq { font-size: 12px; color: var(--waiting); margin-bottom: 6px; }

  /* 長押しで出す起動メニュー(下から出るシート) */
  #sheet-bg { position: fixed; inset: 0; background: rgba(1,4,9,.6); z-index: 40;
              display: none; align-items: flex-end; }
  #sheet-bg.on { display: flex; animation: fadeIn .15s ease-out; }
  #sheet { width: 100%; background: var(--panel); border-top: 1px solid var(--border);
           border-radius: 14px 14px 0 0; padding: 10px 12px calc(var(--safe-bottom) + 10px);
           display: flex; flex-direction: column; gap: 8px;
           animation: sheetUp .2s cubic-bezier(.2,.8,.2,1); }
  #sheet-title { font-size: 12px; color: var(--dim); padding: 4px 4px 2px;
                 overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sheet-btn { width: 100%; padding: 14px; font-size: 15px; border-radius: 10px;
               background: #21262d; border: 1px solid var(--border); color: var(--fg); }
  .sheet-btn:active { background: var(--accent); color: #0d1117; }
  .sheet-btn.cancel { background: none; color: var(--dim); }
  /* 破壊的な操作。確認前は輪郭だけ、確認待ちになったら塗って知らせる */
  .sheet-btn.danger { color: var(--waiting); border-color: rgba(248,81,73,.5); }
  .sheet-btn.danger.armed { background: var(--waiting); color: #fff; border-color: var(--waiting); }
  @keyframes sheetUp { from { transform: translateY(100%); } }
  @keyframes fadeIn { from { opacity: 0; } }
  /* ---- 新規セッション。候補が多いので下から高めに出して中をスクロールさせる ---- */
  #new-bg { position: fixed; inset: 0; background: rgba(1,4,9,.6); z-index: 45;
            display: none; align-items: flex-end; }
  #new-bg.on { display: flex; animation: fadeIn .15s ease-out; }
  #new-sheet { width: 100%; max-height: 82vh; background: var(--panel);
               border-top: 1px solid var(--border); border-radius: 14px 14px 0 0;
               padding: 10px 12px calc(var(--safe-bottom) + 8px);
               display: flex; flex-direction: column; min-height: 0;
               animation: sheetUp .2s cubic-bezier(.2,.8,.2,1); }
  #new-head { display: flex; align-items: center; gap: 8px; padding: 2px 2px 8px; }
  #new-title { font-size: 15px; font-weight: 600; }
  #new-agent { margin-left: auto; }
  /* エージェント切替。今の値だけでなく選べる側も見えるように両方並べる。
     指で押すので PC 版より当たり判定を大きめに取る */
  .agent-toggle { display: inline-flex; background: #21262d; border: 1px solid var(--border);
                  border-radius: 13px; padding: 2px; flex: none; }
  .agent-toggle .opt { font-size: 12px; padding: 5px 12px; border-radius: 11px; color: var(--dim);
                       transition: background .12s, color .12s; }
  .agent-toggle .opt.on { background: var(--accent); color: #0d1117; font-weight: 600; }
  #new-tabs { display: flex; gap: 2px; background: #21262d; border-radius: 9px; padding: 2px; flex: none; }
  .ntab { flex: 1; text-align: center; padding: 8px; font-size: 13px; color: var(--dim); border-radius: 7px; }
  .ntab.on { background: var(--panel); color: var(--fg); }
  #new-list { overflow-y: auto; -webkit-overflow-scrolling: touch; margin-top: 8px; min-height: 0; }
  /* 起動先の候補。指で押しやすいよう縦を厚めに取る */
  .nitem { display: flex; align-items: center; gap: 8px; padding: 12px 8px;
           border-bottom: 1px solid var(--border); }
  .nitem:active { background: #21262d; }
  .nitem .np { font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nitem .nsub { font-size: 11px; color: var(--dim); margin-left: auto; flex: none; }
  /* 「ここで起動」は他の行(=潜るだけ)と役割が違うので色で分ける */
  .nitem.here { color: var(--accent); font-weight: 600; position: sticky; top: 0;
                background: var(--panel); border-bottom: 1px solid var(--accent); }
  .nitem.up { color: var(--dim); }
  #new-list .empty { padding: 20px; text-align: center; color: var(--dim); font-size: 13px; }

  /* SendUserFile のファイルカード。画像は実物を出し、他は名前だけ */
  .fc-caption { font-size: 12.5px; color: var(--fg); margin-bottom: 6px; white-space: pre-wrap; }
  .filecard { border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
              background: var(--bg); margin-bottom: 6px; max-width: 520px; }
  .filecard img, .filecard video { display: block; width: 100%; height: auto; max-height: 320px;
                  object-fit: contain; background: #0d1117; }
  .filecard audio { display: block; width: 100%; }
  .fc-foot { display: flex; align-items: center; gap: 6px; padding: 6px 8px; font-size: 11.5px; }
  .fc-name { color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fc-ico { flex: none; }
  .fc-dl { margin-left: auto; flex: none; color: var(--accent); text-decoration: none; }
  .fc-dl:hover { text-decoration: underline; }
  .toast { animation: toastIn .18s ease-out;
           position: fixed; left: 50%; transform: translateX(-50%);
           bottom: calc(var(--safe-bottom) + 70px); background: #21262d; color: var(--fg);
           border: 1px solid var(--border); border-radius: 20px; padding: 9px 18px;
           font-size: 13.5px; z-index: 60; max-width: 88vw; text-align: center; }
  @keyframes toastIn { from { transform: translate(-50%, 10px); opacity: 0; } }
  /* 失敗は赤で示す。送信できていないことに気づけないと、打ち直しの機会を逃す */
  textarea.send-failed, input.send-failed { border-color: var(--waiting) !important;
    box-shadow: 0 0 0 2px rgba(248,81,73,.25); }
  .toast.error { background: #3a1113; border-color: var(--waiting); color: #ffd7d5;
                 box-shadow: 0 4px 18px rgba(0,0,0,.5); }

  /* 動きを減らす設定の端末では演出を止める */
  @media (prefers-reduced-motion: reduce) {
    #detail, #list { transition: none; }
    #filters, #qwrap { animation: none; }
    #dprompt, .toast, #sheet, #sheet-bg { animation: none; }
  }
</style>

<header>
  <h1>agd</h1>
  <span id="conn" title=""></span>
  <span class="counts" id="counts"></span>
  <button class="hbtn" id="btn-q" aria-label="Search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
  </button>
  <button class="hbtn" id="btn-f" aria-label="Filter">
    <svg viewBox="0 0 24 24"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
  </button>
  <button class="hbtn" id="btn-new" aria-label="New session">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</header>
<div id="qwrap"><input id="q" data-i18n-ph="m.searchPh" placeholder="Filter" autocomplete="off"></div>
<div id="filters"></div>
<div id="list"></div>

<!-- 行の長押しで出す起動メニュー。外側タップで閉じる -->
<div id="sheet-bg">
  <div id="sheet">
    <div id="sheet-title"></div>
    <button class="sheet-btn" id="sheet-rename" data-i18n="m.rename">Rename</button>
    <button class="sheet-btn" id="sheet-resume" data-i18n="m.resume">Resume this session</button>
    <button class="sheet-btn" id="sheet-new" data-i18n="m.launchNew">New session here</button>
    <button class="sheet-btn" id="sheet-dup" data-i18n="m.launchDup">Duplicate</button>
    <button class="sheet-btn danger" id="sheet-kill" data-i18n="m.killSession">Close this session</button>
    <button class="sheet-btn cancel" id="sheet-cancel" data-i18n="m.cancel">Cancel</button>
  </div>
</div>

<!-- 新規セッション。起動先をタブで選ぶ(プロジェクト / 既存セッション) -->
<div id="new-bg">
  <div id="new-sheet">
    <div id="new-head">
      <span id="new-title" data-i18n="m.new.title">New session</span>
      <span class="agent-toggle" id="new-agent">
        <span class="opt on" data-agent="claude">claude</span><span class="opt" data-agent="codex">codex</span>
      </span>
      <button class="hbtn" id="new-close" aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="new-tabs">
      <div class="ntab on" data-tab="tree" data-i18n="m.new.tabTree">Browse</div>
      <div class="ntab" data-tab="proj" data-i18n="m.new.tabProj">Recent</div>
    </div>
    <div id="new-list"></div>
  </div>
</div>

<div id="detail">
  <div id="dhead">
    <button class="hbtn" id="dback" aria-label="Back">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <span class="dot" id="ddot"></span>
    <div style="flex:1;min-width:0">
      <div id="dtitle"></div>
      <div id="dmeta"></div>
    </div>
  </div>
  <div id="dtabs">
    <div data-t="screen" class="on" data-i18n="m.tab.screen">Screen</div>
    <div data-t="log" data-i18n="m.tab.log">Log</div>
  </div>
  <div id="dbody">
    <div id="dscreen"></div>
    <div id="dlog" style="display:none"></div>
  </div>
  <div id="dprompt"><div id="dpq"></div><div class="answers" id="dpa"></div></div>
  <div id="dsend">
    <input id="dinput" data-i18n-ph="m.sendPh" placeholder="Send…" autocomplete="off" enterkeyhint="send">
    <button id="dsendbtn" data-i18n="m.send">Send</button>
  </div>
</div>
